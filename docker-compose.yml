services:
  database:
    image: mongo:7.0
    container_name: music_catalog_db
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - app-network

  api:
    build: .
    container_name: music_catalog_api
    command: sh -c "sleep 15 && uvicorn src.server:application --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - .:/application
      - pip_cache_volume:/root/.cache/pip
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - database
    networks:
      - app-network

volumes:
  mongodb_data:
  pip_cache_volume:

networks:
  app-network:
    driver: bridge
